name: CD

# Push tag vX.Y.Z -> Lint & Test -> Build Docker image -> Push GHCR -> Deploy API (Render) -> Smoke test
# - Web (Vercel) tự deploy khi merge vào main nhờ Git integration; pipeline này kiểm tra lại web sau khi deploy API.
# - Rollback: xem docs/deployment.md (bấm Rollback trên Render/Vercel hoặc deploy lại tag cũ).
# - Chỉ cần 1 secret: RENDER_DEPLOY_HOOK_URL (Settings -> Environments -> production -> Secrets).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  IMAGE_NAME: brewlite-api
  API_URL: https://brewlite-swe-project.onrender.com
  WEB_URL: https://brewlite-swe-project-web.vercel.app

jobs:
  # 1) Quality gate: dùng lại đúng pipeline CI (Install, Lint, Test, Build)
  quality:
    uses: ./.github/workflows/ci.yml

  # 2) Deploy API: báo Render kéo đúng image vừa push (migration chạy khi container khởi động)
  deploy-api:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Gọi Render Deploy Hook đúng commit
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          [ -n "$HOOK" ] || { echo "::error::Thiếu secret RENDER_DEPLOY_HOOK_URL"; exit 1; }
          curl --fail-with-body --silent --show-error --max-time 30 -X POST "${HOOK}&ref=${GITHUB_SHA}"
          echo "Đã yêu cầu Render deploy commit ${GITHUB_SHA}"

  # 3) Smoke test: chờ Render build xong rồi kiểm tra health, danh sách sản phẩm và trang menu
  smoke-test:
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Chờ Render thay bản mới
        run: sleep 90

      - name: API /health (200 nghĩa là API và PostgreSQL đều sống)
        run: curl --fail --silent --show-error --retry 30 --retry-delay 10 --retry-all-errors --max-time 20 "$API_URL/health"

      - name: API /products
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors --max-time 20 -o /dev/null "$API_URL/products"

      - name: Web /menu
        run: curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors --max-time 20 -o /dev/null "$WEB_URL/menu"
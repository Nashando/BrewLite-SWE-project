name: Secret scan

# Quét toàn bộ lịch sử git để phát hiện secret bị commit nhầm (minh chứng cho biên bản docs/security-audit.md).
on:
  push:
    branches: [main, CI]
  pull_request:
    branches: [main, CI]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
